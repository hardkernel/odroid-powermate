# Builds a release for every pushed version tag (v1.5.1, v2.0.0-rc1, ...): the
# merged firmware image from `powermate_gen_single_bin` and PMTUI for desktops and
# SBCs, published on the tag's GitHub release. Push each tag on its own
# (`git push origin v1.5.1`); GitHub starts no run when more than three tags are
# pushed at once. A tag without a run (pushed before this file existed, or missed)
# is released from the Actions tab, choosing the branch of its line (v1.x or
# master) under "Use workflow from".
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v1.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the tag is a release version
        shell: bash
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rcN"
            exit 1
          fi

  firmware:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    outputs:
      notes_start: ${{ steps.prev.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # cmake/version.cmake names the firmware after `git describe --tags`.
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The release notes start from the previous release of the same line, so a
      # 1.x release made after 2.0 is not compared with 2.0.
      - name: Find the previous release on this line
        id: prev
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$TAG^" 2> /dev/null || true)
          echo "Previous release: ${prev:-none}"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      # `git describe` prefers an annotated tag, or the alphabetically first
      # lightweight one, when several tags share a commit (v1.3.2-test and v1.3.3 do).
      - name: Leave the release tag as the only tag on its commit
        shell: bash
        run: |
          for t in $(git tag --points-at HEAD); do
            [ "$t" = "$TAG" ] || git tag -d "$t"
          done
          test "$(git describe --tags --abbrev=0)" = "$TAG"

      # Vite 7 needs Node.js 20.19+ or 22.12+ (page/package.json engines). No
      # dependency cache: release builds start from the lockfiles alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install nanopb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nanopb protobuf-compiler

      - name: Build the merged firmware image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build powermate_gen_single_bin

      - name: Check the image is named after the tag
        shell: bash
        run: |
          shopt -s nullglob
          bins=(build/powermate-*.bin)
          want="build/powermate-$TAG-$(git rev-parse --short HEAD).bin"
          if [ "${#bins[@]}" -ne 1 ] || [ "${bins[0]}" != "$want" ]; then
            echo "::error::expected $want, found: ${bins[*]}"
            exit 1
          fi
          echo "Merged image: $want"

      - name: Collect the licenses
        shell: bash
        run: |
          shopt -s nullglob
          {
            printf '== ODROID PowerMate firmware ==\n'; cat LICENSE
            printf '\n== proto/status.proto and the code generated from it ==\n'; cat proto/LICENSE
            printf '\n== ESP-IDF ==\n'; cat "$IDF_PATH/LICENSE"
            if [ -f "$IDF_PATH/docs/en/COPYRIGHT.rst" ]; then
              printf '\n== ESP-IDF third-party components ==\n'; cat "$IDF_PATH/docs/en/COPYRIGHT.rst"
            fi
            for f in managed_components/*/LICENSE*; do
              printf '\n== %s ==\n' "${f%/*}"; cat "$f"
            done
            for p in $(node -e 'console.log(Object.keys(require("./page/package.json").dependencies || {}).join(" "))'); do
              for f in "page/node_modules/$p"/LICENSE*; do
                printf '\n== web UI: %s ==\n' "$p"; cat "$f"
              done
            done
          } > "build/powermate-$TAG-LICENSES.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            build/powermate-*.bin
            build/powermate-*-LICENSES.txt
          if-no-files-found: error

  pmtui:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # The newest Go release, for its crypto/tls and net/http fixes; go.mod only
      # sets the minimum. No cache, as for the firmware.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Test
        working-directory: example/pmtui
        run: |
          go version
          go vet ./...
          go test ./...

      - name: Build and package
        working-directory: example/pmtui
        shell: bash
        run: |
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          go_license="$(go env GOROOT)/LICENSE"
          [ -f "$go_license" ] || { echo "::error::no Go license at $go_license"; exit 1; }
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64 windows/amd64; do
            IFS=/ read -r goos goarch goarm <<< "$target"
            name="pmtui-$TAG-$goos-$goarch${goarm:+v$goarm}"
            exe=pmtui
            [ "$goos" = windows ] && exe=pmtui.exe
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            export CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOARM="$goarm"
            go build -trimpath -ldflags "-s -w" -o "$stage/$exe" .
            cp LICENSE README.md "$stage/"
            # The statically linked modules differ per target.
            {
              go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}} {{.Dir}}{{end}}{{end}}' . |
                sort -u | while read -r mod dir; do
                  [ -n "$mod" ] || continue
                  for f in "$dir"/LICENSE* "$dir"/COPYING* "$dir"/NOTICE*; do
                    if [ -f "$f" ]; then printf '== %s (%s) ==\n' "$mod" "${f##*/}"; cat "$f"; echo; fi
                  done
                done
              printf '== Go standard library and runtime ==\n'; cat "$go_license"
            } > "$stage/THIRD_PARTY_LICENSES.txt"
            unset CGO_ENABLED GOOS GOARCH GOARM
            if [ "$goos" = windows ]; then
              (cd "$RUNNER_TEMP" && zip -qr "$out/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP" -czf "$out/$name.tar.gz" "$name"
            fi
          done
          ls -l "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmtui
          path: dist/*
          if-no-files-found: error

  release:
    needs: [firmware, pmtui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # MD5SUMS is what the wiki lists next to each download.
      - name: Write checksums
        working-directory: dist
        shell: bash
        run: |
          files=(*)
          md5sum -- "${files[@]}" > MD5SUMS
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat MD5SUMS SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_START: ${{ needs.firmware.outputs.notes_start }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A rebuild is not byte-identical and a moved tag renames the image, so
            # drop the published files this build does not replace.
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            while IFS= read -r name; do
              case "$name" in
                powermate-*|pmtui-*|MD5SUMS|SHA256SUMS)
                  [ -e "dist/$name" ] || gh release delete-asset "$TAG" "$name" --yes ;;
              esac
            done <<< "$assets"
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          # 1.x keeps getting releases after 2.0, so only the highest stable
          # version is marked Latest.
          highest=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[].ref' |
            sed 's|^refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$TAG" = "$highest" ]; then flags+=(--latest); else flags+=(--latest=false); fi
          [ -z "$NOTES_START" ] || flags+=(--notes-start-tag "$NOTES_START")
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
